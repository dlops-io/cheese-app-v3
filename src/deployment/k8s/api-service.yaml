# The API. Nothing about a chat lives in a pod: history is in Cloud Storage, so any copy can answer
# any message, and the HPA (hpa.yaml) can add and remove copies freely.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service # deploy-k8s.sh adds the Workload Identity annotation; deploy_k8s binds this name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  CHROMADB_HOST: vector-db
  CHROMADB_PORT: "8000"
  # deploy-k8s.sh fills these in for your project
  GCP_PROJECT: ""
  CHAT_BUCKET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels: { app: api-service }
spec:
  # No `replicas`: the HPA owns it. Writing it here would knock a scaled-out API back down to that
  # number on every `kubectl apply`.
  selector:
    matchLabels: { app: api-service } # the glue: the Service uses the same label
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # a new pod is ready before an old one leaves
  template:
    metadata:
      labels: { app: api-service }
    spec:
      serviceAccountName: api-service
      terminationGracePeriodSeconds: 150 # the preStop sleep, then up to 120 s for answers in progress
      containers:
        - name: api-service
          image: cheese-app-api-service # pinned to the pushed image by deploy-k8s.sh
          ports: [{ name: http, containerPort: 9000 }]
          envFrom:
            - configMapRef: { name: api-config }
          resources:
            # TensorFlow holds about 420 MiB. The HPA's 70% is measured against the CPU request.
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: "1500m", memory: 1Gi }
          startupProbe: # importing TensorFlow takes a while on a small CPU share
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe: # no traffic until the CNN model is loaded and Chroma answers
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe: # /healthz touches nothing else, so a Chroma blip restarts nothing
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Keep serving while Google's load balancer detaches the pod, which can take well over
            # 15 s. Without this, a rolling update drops requests.
            preStop:
              sleep: { seconds: 30 }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: persistent, mountPath: /persistent } # the CNN model, downloaded by each pod
      volumes:
        - name: tmp
          emptyDir: {}
        - name: persistent
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-service # the name nginx calls: http://api-service:9000
spec:
  selector: { app: api-service }
  ports: [{ name: http, port: 9000, targetPort: http }]
