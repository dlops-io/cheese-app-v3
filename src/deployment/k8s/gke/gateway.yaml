# One public entrance: a Google global external load balancer, made from these objects by GKE's
# Gateway controller. It answers on the static IP from deploy_base.
#   http://<ip>/api/*  -> api-service
#   http://<ip>/*      -> frontend-react
# Nobody strips the prefix: the API serves exactly the paths the browser asks for.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cheese-app
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: cheese-app-gateway-ip # set by deploy-k8s.sh, from deploy_base
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cheese-app
spec:
  parentRefs:
    - name: cheese-app
      sectionName: http
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: api-service, port: 9000 }]
    - backendRefs: [{ name: frontend-react, port: 80 }]
---
# The load balancer runs its own health checks, separate from the kubelet's probes. Its default is
# GET / on the serving port, which the API answers with 404, so each Service gets its real check.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: api-service
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 3
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /readyz }
  targetRef: { group: "", kind: Service, name: api-service }
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: frontend-react
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 3
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /healthz }
  targetRef: { group: "", kind: Service, name: frontend-react }
---
# A Gemini answer can take a minute: set the load balancer's timeout rather than rely on its default.
# A pod that is shutting down finishes its answers once the load balancer stops sending it new ones.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api-service
spec:
  default:
    timeoutSec: 120
    connectionDraining: { drainingTimeoutSec: 60 }
  targetRef: { group: "", kind: Service, name: api-service }
