# The local cluster: three nodes, each a Docker container on the laptop.
# Kubernetes 1.36, the same version as the Cheese Shop tutorial, rather than kind's default 1.37.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      # http://localhost:8090 on the laptop reaches the frontend's NodePort (8080 is Cheese Shop's)
      - containerPort: 30090
        hostPort: 8090
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
