[project]
name = "cheese-app-deployment"
version = "3.0.0"
description = "Cheese App deployment tooling: Pulumi programs for the cloud, scripts for the workloads"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pulumi==3.272.0",
    "pulumi-docker-build==0.0.22",
    "pulumi-gcp==10.2.0",
]

[dependency-groups]
dev = ["ruff==0.17.3"]

# Pulumi programs and scripts, not a library: install the dependencies only.
[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
