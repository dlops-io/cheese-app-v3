[project]
name = "cheese-app-api"
version = "3.0.0"
description = "Cheese App API: content, and chat with Gemini, a CNN and RAG"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb-client>=1.5.9",
    "fastapi>=0.141.1",
    "google-genai>=1.47.0",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    # The CPU build is smaller, but it has no Linux arm64 wheel, which is what Apple silicon runs
    "tensorflow-cpu==2.21.0; platform_machine == 'x86_64'",
    "tensorflow==2.21.0; platform_machine == 'aarch64'",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

# An application, not a library: install the dependencies only, never build a wheel of this project.
[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep pytest's cache off the bind mount in container development.
cache_dir = "${HOME}/.cache/cheese-app-api/pytest"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["_test.py"]
